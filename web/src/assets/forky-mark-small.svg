<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Forky: a canonical head node with the Ethereum glyph">
  <!--
    Forky small mark - the canonical head node from forky-mark.svg alone,
    for tiny contexts (header chip, favicons) where the full fork-choice
    graph collapses into noise. Same universal palette: solids hold
    >= 3:1 non-text contrast on white and near-black; the core is opaque
    (tint baked solid) so content never bleeds through the node.
  -->
  <circle cx="32" cy="32" r="26" fill="#d1ece3"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#009362" stroke-width="6"/>
  <g fill="#5872e8">
    <path d="M32 13.8 L20.3 33.7 L32 40.2 Z" fill="#8ea9e6"/>
    <path d="M32 13.8 L43.7 33.7 L32 40.2 Z"/>
    <path d="M32 51 L20.3 36.5 L32 42.8 Z" fill="#8ea9e6"/>
    <path d="M32 51 L43.7 36.5 L32 42.8 Z"/>
  </g>
</svg>
